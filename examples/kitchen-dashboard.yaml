# Kitchen dashboard — Counter Panel layout.
# Paste as the whole dashboard (Edit → ⋮ → Raw configuration editor), then swap entity IDs for yours.
# Needs (all through HACS): Counter Panel Cards v0.4.0+, League Scoreboard Card v0.4.0+, Kiosk Mode.

# Hide Home Assistant's top bar ("Kitchen" + the Assist bubble) and the sidebar for non-admin
# users, i.e. the Kitchen Display account on the iPad. Your own admin login keeps them so you
# can still edit. On any device: add ?kiosk to the address to hide them, ?disable_km to show them.
kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true

title: Kitchen
views:
  - title: Kitchen
    path: kitchen
    type: panel
    cards:
      - type: custom:counter-layout-card
        padding: 24
        gap: 16
        rows:
          # ── Header: clock and date, then every home control in a sideways-scrolling strip, alarm pinned right
          - card:
              type: custom:counter-header-card
              subtitle: Kitchen · Counter Panel
              alarm_entity: alarm_control_panel.home
              tile_width: 210
              controls:
                - entity: climate.main_floor
                  name: Living Room
                - entity: climate.bedroom
                  name: Master Bedroom
                - entity: lock.front_door
                  name: Front Door Lock
                - entity: cover.garage_door
                  name: Garage Door
                - entity: binary_sensor.front_door_contact
                  name: Front Door
                - entity: binary_sensor.back_door_contact
                  name: Back Door
                - entity: media_player.living_room_living_room
                  name: Apple TV

          # ── Security: five UniFi Protect cameras
          # live: true plays the real video stream in the tile; the others are snapshots every `refresh` seconds.
          # Each live stream is work for the iPad: start with one or two and add more if it stays smooth.
          - card:
              type: custom:counter-cameras-card
              title: Security
              refresh: 2                               # snapshot tiles: a new picture every 2 s
              cameras:
                - entity: camera.doorbell_high_resolution_channel
                  name: Doorbell
                  live: true
                  # stream_entity: camera.doorbell_medium_resolution_channel   # optional lighter stream for the tile (enable it on the camera's device page first)
                  ring: event.doorbell_doorbell        # or binary_sensor.doorbell_doorbell on older installs
                  motion: binary_sensor.doorbell_motion
                - entity: camera.front_camera_high_resolution_channel
                  name: Front Yard
                  live: true
                  motion: binary_sensor.front_camera_motion_motion
                - entity: camera.backyard_high_resolution_channel
                  name: Back Yard
                  motion: binary_sensor.backyard_motion
                - entity: camera.downstairs_high_resolution_channel
                  name: Downstairs
                  motion: binary_sensor.downstairs_motion
                - entity: camera.mikko_cam_high_resolution_channel
                  name: Mikko Cam
                  motion: binary_sensor.mikko_cam_motion

          # ── Three columns, each scrolling inside its cards: calendar | meals + shopping | weather + scores
          - columns:
              - - type: custom:counter-calendar-card
                  title: Calendar
                  days: 7
                  calendars:
                    - entity: calendar.denowh_calendar
                      name: Family
                      color: "#6C93AD"
                    - entity: calendar.bells_calendar
                      name: B
                      color: "#B0698C"
                    - entity: calendar.j_calendar
                      name: J
                      color: "#D9A441"
                    - entity: calendar.davies_outlook_calendar
                      name: DEG
                      color: "#4FA08A"

              - - type: custom:counter-meals-card
                  title: Meals This Week
                  entity: calendar.meals                # a Local Calendar named "Meals": one all-day event per dinner
                - type: custom:counter-shopping-card
                  title: Shopping List
                  entity: todo.shopping_list

              - - type: custom:counter-weather-card
                  entity: weather.forecast_home
                - type: custom:league-scoreboard-card
                  title: Scores
                  mode: compact
                  style: counter
                  max: 0                                # no limit: the card scrolls
                  teams:
                    - sensor.chelsea
                    - sensor.montana_state_bobcats
                    - sensor.dallas_stars
                  entities:
                    - entity: sensor.nfl_scoreboard
                      label: NFL
                    - entity: sensor.ncaaf_top_25
                      label: CFB
                    - entity: sensor.big_sky_football
                      label: BSKY
                  tap_action:
                    action: navigate
                    navigation_path: /dashboard-kitchen/sports

  # ── Full Sports page (opened by tapping the scores)
  - title: Sports
    path: sports
    subview: true
    back_path: /dashboard-kitchen/kitchen
    type: panel
    cards:
      - type: custom:counter-layout-card
        rows:
          - card:
              type: heading
              heading: Back to Kitchen
              tap_action:
                action: navigate
                navigation_path: /dashboard-kitchen/kitchen
          - columns:
              - - type: custom:league-scoreboard-card
                  title: My Teams
                  teams:
                    - sensor.chelsea
                    - sensor.montana_state_bobcats
                    - sensor.dallas_stars
                - type: custom:league-scoreboard-card
                  title: NFL
                  entity: sensor.nfl_scoreboard
              - - type: custom:league-scoreboard-card
                  title: NCAAF Top 25
                  entity: sensor.ncaaf_top_25
                - type: custom:league-scoreboard-card
                  title: Big Sky
                  entity: sensor.big_sky_football
                  visible_games: 3                      # three games tall; scroll for the rest
                  favorites:
                    - MTST
